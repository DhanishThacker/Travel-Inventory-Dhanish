spring.application.name=travel-inventory

# File-backed H2 database (NOT in-memory). Created under ./data on first start.
# LOCK_TIMEOUT: how long (ms) a writer waits for a row lock held by another transaction.
spring.datasource.url=jdbc:h2:file:./data/travel-inventory;LOCK_TIMEOUT=10000
spring.datasource.username=sa
spring.datasource.password=

# schema.sql is idempotent (CREATE ... IF NOT EXISTS) and runs on every start.
spring.sql.init.mode=always

# Keep JSON decimals exact (e.g. 331.7) when they land in JsonNode metadata.
spring.jackson.deserialization.use-big-decimal-for-floats=true

server.port=8080
